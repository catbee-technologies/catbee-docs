name: Bug Report
description: Report an issue with the documentation or the docs website.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a documentation issue!  
        Please fill in the details below to help us address it quickly.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-checks
      description: Help us triage faster by confirming the following.
      options:
        - label: I searched existing issues and discussions to avoid duplicates.
          required: true
        - label: I refreshed the page and cleared browser cache if UI-related.
          required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - 'All Documentation'
        - '@catbee/utils Documentation'
        - '@catbee/mysql Documentation'
        - '@ng-catbee/* Documentation'
        - 'Broken Link or 404'
        - 'Sidebar / Navigation'
        - 'Search Functionality'
        - 'UI / Layout / Theme Issue'
        - 'Docusaurus Build / Deployment'
        - 'Other'
      multiple: true
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page URL or File Path
      placeholder: e.g., https://catbee.in/docs/@catbee/mysql/intro or docs/@catbee/utils/intro.md
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, and version (for UI/layout or search issues).
      placeholder: |
        - OS: Ubuntu 22.04 / macOS 14 / Windows 11
        - Browser: Chrome 130 / Firefox 131 / Safari 18
    validations:
      required: false

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Short and clear description of the problem.
      placeholder: e.g., Broken link on MySQL intro page or search modal fails to open on mobile.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to see the issue.
      placeholder: |
        1. Navigate to page ...
        2. Click on ...
        3. See error or missing content ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what should have happened or what content should be displayed.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened. Include screenshots if helpful.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / Build Logs (if applicable)
      description: Include build output, console errors, or DevTools logs. Wrap in triple backticks.
      placeholder: |
        ```
        <paste logs or console errors here>
        ```
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      placeholder: Screenshots, related issues, or anything else useful.
