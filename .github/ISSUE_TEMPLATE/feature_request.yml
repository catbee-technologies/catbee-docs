name: Feature Request
description: Suggest improvements or new ideas for the documentation or docs website.
title: '[Feature]: '
labels: ['enhancement', 'feature-request', 'improvement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the documentation or website?  
        Please fill out the details below to help us evaluate your request.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-checks
      description: Help us triage faster by confirming the following.
      options:
        - label: I searched existing issues and discussions to avoid duplicates.
          required: true
        - label: I verified this request is related to documentation or the docs website.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of Improvement
      options:
        - 'New Documentation Page / Guide'
        - 'Improve Existing Documentation'
        - 'Interactive Code Examples / Demos'
        - 'Navigation / Sidebar Improvements'
        - 'Search Improvements'
        - 'UI / Layout / Theme Enhancements'
        - 'Docusaurus Build / Tooling'
        - 'Other'
      multiple: true
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Feature Summary
      description: A short, clear summary of the requested feature.
      placeholder: e.g., Add a section for environment variable examples in @catbee/utils.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Why is this needed? What problem does it solve for readers or contributors?
      placeholder: |
        Explain the motivation or difficulty readers face that this addition would solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Provide detailed behavior or content outline if possible.
      placeholder: |
        Explain how you imagine this improvement working. Include Markdown/MDX snippets where applicable:

        ```markdown
        # Proposed section or guide structure
        ```
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Cases / Target Audience
      description: Describe who this helps and why it matters.
      placeholder: |
        - As a developer using @catbee/utils, I want ...
        - This enables ...
        - This improves clarity / developer onboarding ...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Bullet points describing how we'll know this request is complete.
      placeholder: |
        - [ ] New guide/page is written and reviewed
        - [ ] Navigation sidebar is updated
        - [ ] Code examples verified
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      placeholder: Links to other documentation, mockups, screenshots, or inspiration.
